<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enhedskonvertering</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Konvertering af enheder</h1>

        <!-- Valg af type -->

        <label for="type">Vælg type</label>

        <select id="type">
            <option value="temperatur">Temperatur</option>
            <option value="længde">Længde</option>
            <option value="vægt">Vægt</option>
        </select>

        <!-- Valg af konvertering -->

        <label for="konvertering">Vælg konvertering</label>

        <select id="konvertering">
            <option value="celsius-fahrenheit">Celsius til Fahrenheit</option>
            <option value="fahrenheit-celsius">Fahrenheit til Celsius</option>
        </select>

        <!-- Input og resultat -->

        <label for="værdi">Indtast værdi</label>
        <input id="værdi" placeholder="Indtast en værdi">

        <button id="konverterKnap">Konvertér</button>

        <p id="resultat"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
